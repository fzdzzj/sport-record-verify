server:
  port: 8081

spring:
  application:
    name: user-service
  # 从 Nacos 配置中心拉取同名配置（optional：Nacos 不可用时启动不失败）
  config:
    import: optional:nacos:user-service.yml
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yml
  # 数据源：独立 user_db
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 宿主机已有 MySQL 占用 3306 时，compose 侧设 MYSQL_PORT=3307，服务侧注入同名变量即可，默认仍 3306
    url: jdbc:mysql://127.0.0.1:${MYSQL_PORT:3306}/user_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    # 骨架阶段容错：中间件未启动时服务仍可启动（连接延迟到首次访问）；
    # 生产环境建议移除并保持 fail-fast，让数据库故障在启动期暴露
    hikari:
      initialization-fail-timeout: -1
  # Redisson 自动装配数据源（redisson-spring-boot-starter），业务随后续变更使用
  data:
    redis:
      host: 127.0.0.1
      port: 6379

# ===== 认证鉴权（add-jwt-auth，见 ADR-0007）=====
# 认证域是本服务的签发端：注册/登录/刷新签发 HS256 双 token；
# 业务接口的 token 校验统一由网关 GlobalFilter 承担（本服务不自行校验 token）。
app:
  internal:
    # 内部接口共享密钥（add-resilience-hardening，见 ADR-0007）：生产必须注入 INTERNAL_API_TOKEN
    auth-enabled: true
    token: ${INTERNAL_API_TOKEN:local-demo-internal-token}
  auth:
    # 鉴权降级开关：false=旧行为（业务接口显式携带 userId），true=网关强制鉴权 + 数据隔离（X-User-Id）
    # 默认 false 兼容本地调试与压测脚本；切换 true 前先验证 7 个 commit 的验收项，并更新压测脚本带 token
    enabled: false
    jwt:
      # HS256 对称密钥（>=32 字节）：网关与 user-service 必须一致（网关注入 X-User-Id，服务按同一密钥信任）
      # 本地默认值仅演示；生产必须经环境变量 JWT_SECRET 或 Nacos 配置覆盖
      secret: ${JWT_SECRET:sport-verify-hs256-secret-key-0123456789abcdef}
      # access token 时效：15 分钟（短时效，业务接口每次请求携带，泄露窗口可控）
      access-ttl-minutes: 15
      # refresh token 时效：7 天（仅换新用；Redis 存活校验 + 轮换作废，见 refresh 配置）
      refresh-ttl-days: 7
    refresh:
      # refresh token 存活键前缀（Redis，key=auth:refresh:{userId}:{jti}，TTL 与 refresh 时效一致；
      # 轮换时原子作废旧 jti，防重放，见 ADR-0007；值含冒号须加引号，否则 snakeyaml 报 mapping 错误）
      redis-prefix: "auth:refresh:"
    # 登录失败锁定（add-login-lockout，见 ADR-0007）：
    # 同一窗口内连续失败达阈值 → 写 auth:lock:{phone}（TTL=lock-minutes），期间登录入口直接拒绝
    # （不校验密码、不计数，防撞库 + 省 BCrypt）。灰度期 enabled=false 即回到「只计数告警」旧行为。
    lock:
      # 锁定开关：false=仅计数告警不真正锁定（兼容旧行为）
      enabled: true
      # 失败阈值：窗口内连续失败达此数触发锁定（对齐 AuthService 原 FAIL_THRESHOLD）
      threshold: 5
      # 失败计数窗口（分钟）：窗口滑动，窗口内持续 INCR
      window-minutes: 15
      # 锁定时长（分钟）：到达锁定时长后 auth:lock:{phone} TTL 到期自然解锁
      lock-minutes: 15

# MyBatis-Plus 基础配置（无 Mapper 骨架阶段仅占位）
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

management:
  endpoints:
    web:
      exposure:
        # prometheus：/actuator/prometheus 以 Prometheus 文本格式暴露 Micrometer 指标（监控抓取入口）；
        # metrics：/actuator/metrics JSON 查询端点（手工排查看单个指标）
        include: health,info,prometheus,metrics
  # HTTP 指标直方图：默认只输出 count/sum/max（summary），没有 bucket；
  # P95 计算（PromQL histogram_quantile）依赖 bucket，必须显式开启，
  # 告警规则（P95>200ms）与 Grafana P95 面板均依赖此开关
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
  endpoint:
    health:
      # narrow-actuator-exposure：never——health 仍返回 UP/status，不泄组件明细
      show-details: never

# 请求贯穿：MDC traceId（add-request-tracing）
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"
