server:
  port: 8081

spring:
  application:
    name: user-service
  # 从 Nacos 配置中心拉取同名配置（optional：Nacos 不可用时启动不失败）
  config:
    import: optional:nacos:user-service.yml
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yml
  # 数据源：独立 user_db
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 宿主机已有 MySQL 占用 3306 时，compose 侧设 MYSQL_PORT=3307，服务侧注入同名变量即可，默认仍 3306
    url: jdbc:mysql://127.0.0.1:${MYSQL_PORT:3306}/user_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    # 骨架阶段容错：中间件未启动时服务仍可启动（连接延迟到首次访问）；
    # 生产环境建议移除并保持 fail-fast，让数据库故障在启动期暴露
    hikari:
      initialization-fail-timeout: -1
  # Redisson 自动装配数据源（redisson-spring-boot-starter），业务随后续变更使用
  data:
    redis:
      host: 127.0.0.1
      port: 6379

# MyBatis-Plus 基础配置（无 Mapper 骨架阶段仅占位）
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

management:
  endpoints:
    web:
      exposure:
        # prometheus：/actuator/prometheus 以 Prometheus 文本格式暴露 Micrometer 指标（监控抓取入口）；
        # metrics：/actuator/metrics JSON 查询端点（手工排查看单个指标）
        include: health,info,prometheus,metrics
  # HTTP 指标直方图：默认只输出 count/sum/max（summary），没有 bucket；
  # P95 计算（PromQL histogram_quantile）依赖 bucket，必须显式开启，
  # 告警规则（P95>200ms）与 Grafana P95 面板均依赖此开关
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
  endpoint:
    health:
      show-details: always
