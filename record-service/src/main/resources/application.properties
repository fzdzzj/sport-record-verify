# ============================================================
# record-service 配置（properties 格式）
#
# 为何不用 application.yml：ShardingSphere 5.4.1 的 YamlEngine 依赖
# snakeyaml 1.x（Representer 无参构造），而 Spring Boot 3.2.4 的 YAML
# 属性加载需要 snakeyaml 2.x（TagInspector）——两者无法共存于同一类路径。
# 因此本服务 Spring 侧配置改用 properties（不触发 Spring YAML 解析），
# 并把 snakeyaml 整体降级 1.33 供 ShardingSphere 使用（见 pom.xml
# dependencyManagement）。Nacos 数据文件同步使用 record-service.properties。
# ============================================================

server.port=8082

spring.application.name=record-service

# Nacos 配置中心（optional：Nacos 不可用时服务仍可启动）
spring.config.import=optional:nacos:record-service.properties

spring.cloud.nacos.discovery.server-addr=127.0.0.1:8848
spring.cloud.nacos.config.server-addr=127.0.0.1:8848
spring.cloud.nacos.config.file-extension=properties

# 数据源由 ShardingSphere 代理接管（见 ShardingDataSourceConfig + sharding.yaml）：
# 5.4.0+ 已无 spring-boot-starter，不再使用 spring.datasource / spring.shardingsphere.* 属性；
# 代理内嵌 HikariCP 指向 record_db，track_point 分片落 track_point_0..15，其余表落单库。

# RocketMQ：提交进入 VERIFYING 后发布 SUBMITTED 事件，触发 verify 校验闭环
# （榜单事件消费已随榜单职责迁至 leaderboard-service，独立消费组 leaderboard-consumer-group，
# 本服务不再订阅 VERIFIED/REJECTED，避免双写榜单，见 ADR-0005）
rocketmq.name-server=127.0.0.1:9876
rocketmq.producer.group=record-service-group
# 同步发送超时（默认 3s）：首启冷路由 + 演示机高负载下 3s 偶发不够，放宽到 5s；
# MQ 不可用时提交线程最多阻塞 5s 后走 Feign 熔断降级路径（主链路不挂）
rocketmq.producer.send-message-timeout=5000

# Redis（Redisson starter 自动装配 RedissonClient；StringRedisTemplate 由 spring-data-redis 提供）：
# 点赞计数 like:count:{recordId} / 成员集 like:record:{recordId}:users / pending 队列 like:pending:ops
# （榜单键 leaderboard:overall / lock:rollback / lock:scheduler:leaderboard 已随榜单服务迁出）
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379

mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl

# ===== Feign 熔断降级（压测变更 spec「熔断降级转人工」，对应 T11）=====
# 开启后 VerifyApi 调用经 Resilience4j CircuitBreaker 包裹；verify 不可用时
# VerifyApiFallback 统一抛 4001 → 提交链路转人工（MANUAL_REVIEW），主链路不挂
spring.cloud.openfeign.circuitbreaker.enabled=true
# 全局默认超时（add-resilience-hardening）：避免未覆盖客户端走 Feign 默认 10s/60s
spring.cloud.openfeign.client.config.default.connect-timeout=1000
spring.cloud.openfeign.client.config.default.read-timeout=3000
# verify-service 保持显式覆盖（与 default 同值，便于检索）
spring.cloud.openfeign.client.config.verify-service.connect-timeout=1000
spring.cloud.openfeign.client.config.verify-service.read-timeout=3000
# Resilience4j：10 次滑动窗口失败率 ≥50% → OPEN 10s → 半开试探 3 次
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
# Feign 调用慢调用也计为失败（自动从超时熔断）
resilience4j.timelimiter.configs.default.timeout-duration=4s
resilience4j.timelimiter.configs.default.cancel-running-future=true

# ===== 认证鉴权（add-jwt-auth，见 ADR-0007）=====
# 鉴权降级开关：false=旧行为（提交/点赞 userId 显式携带），true=以网关注入的 X-User-Id 认定身份
# （显式携带值不一致 → 403 越权）。默认 false 兼容本地调试与压测脚本；
# 切换 true 前先验证验收项并更新压测脚本带 token。本服务只消费网关注入身份，不自行签发/校验 token
app.auth.enabled=false

# ===== 校验降级转人工（VerifyDegradeService）=====
# MQ 正常但 verify 停机：VERIFYING 滞留超过 stuck-seconds 触发补偿（探活失败→转人工，恢复→重发事件补判）
record.verify-degrade.stuck-seconds=120
record.verify-degrade.compensate-enabled=true

# ===== 轨迹落库路径（压测「连接池调优案例」）=====
# false=基线逐条 INSERT（优化前），true=单分片多值批量 INSERT（优化后，见压测报告前后对比）
record.track.batch-insert-enabled=false

# prometheus：/actuator/prometheus 以 Prometheus 文本格式暴露 Micrometer 指标（监控抓取入口）；
# metrics：/actuator/metrics JSON 查询端点（手工排查看单个指标）
# 注意：本服务配置必须保持 properties 格式（snakeyaml 1.x/2.x 冲突，见文件头说明），勿改回 yml
management.endpoints.web.exposure.include=health,info,prometheus,metrics
# HTTP 指标直方图：默认只输出 count/sum/max（summary），没有 bucket；
# P95 计算（PromQL histogram_quantile）依赖 bucket，必须显式开启（告警与面板依赖）
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.endpoint.health.show-details=always

# ===== 内部接口共享密钥（add-resilience-hardening，见 ADR-0007）=====
# 本地演示默认值；生产必须经环境变量 INTERNAL_API_TOKEN 注入
app.internal.auth-enabled=true
app.internal.token=${INTERNAL_API_TOKEN:local-demo-internal-token}
