# ============================================================
# 运动记录真实性校验系统 · 中间件与监控栈一键编排
# 用法：docker compose up -d     （首次会拉取镜像，稍候）
#       docker compose down      （停止并移除容器，数据卷保留）
# 编排内容：Nacos 2.3.2 / MySQL 8（user_db·record_db·verify_db 三库）/ Redis 7 / RocketMQ 5
#           + PostGIS 16（road_db 路网空间库，mapmatch-service 路网匹配）
#           + Prometheus 2.51（抓取与告警）/ Grafana 10.4（面板，provisioning 预置）
# 说明：MySQL 采用单实例三库（逻辑独立），如需物理隔离拆成三个 service 即可（见 ADR-0001）；
#       监控栈见 ADR-0003——本地内存预算吃紧时可先 docker compose up -d prometheus 前的六件套，
#       prometheus/grafana 单独按需拉起
# ============================================================
name: sport-verify

services:
  # ---------- 注册中心 / 配置中心 ----------
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: sport-verify-nacos
    environment:
      # 单机模式，内嵌 Derby 存储（开发环境够用）
      - MODE=standalone
      # 关闭鉴权，本地开发直连
      - NACOS_AUTH_ENABLE=false
      - JVM_XMS=256m
      - JVM_XMX=512m
    ports:
      - "8848:8848"   # 控制台与 HTTP 接口
      - "9848:9848"   # gRPC 端口（Nacos 2.x 客户端必需）
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - sport-verify-net

  # ---------- MySQL：user_db / record_db / verify_db 三个逻辑独立库 ----------
  mysql:
    image: mysql:8.0
    container_name: sport-verify-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Shanghai
    ports:
      # 宿主机端口可用 MYSQL_PORT 覆盖（默认 3306；宿主机已有 MySQL 时设 3307 即可，服务侧同步注入同名变量）
      - "${MYSQL_PORT:-3306}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      # 首次初始化时按文件名顺序执行 sql/ 下全部建表脚本（幂等，可重复执行）
      - ./sql:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - sport-verify-net

  # ---------- Redis：榜单 ZSet / 点赞计数 / 缓存 ----------
  redis:
    image: redis:7.2-alpine
    container_name: sport-verify-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - sport-verify-net

  # ---------- RocketMQ：NameServer ----------
  rocketmq-namesrv:
    image: apache/rocketmq:5.2.0
    container_name: sport-verify-rocketmq-namesrv
    command: sh mqnamesrv
    ports:
      - "9876:9876"   # NameServer 端口
    healthcheck:
      # 镜像内无 ss/nc（iproute2 未装，会永远 unhealthy），用 bash /dev/tcp 探测端口
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/9876"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - sport-verify-net

  # ---------- RocketMQ：Broker ----------
  rocketmq-broker:
    image: apache/rocketmq:5.2.0
    container_name: sport-verify-rocketmq-broker
    # -c 必须显式指向挂载的 broker.conf：否则 brokerIP1=127.0.0.1 不生效，
    # broker 以容器内网 IP 注册路由 → 宿主机服务发送超时（sendDefaultImpl call timeout）
    command: sh mqbroker -c /home/rocketmq/conf/broker.conf -n rocketmq-namesrv:9876
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      # Docker Desktop（WSL2 cgroup v2）下 JDK 已知 NPE：StoreUtil.<clinit> 经
      # CgroupV2Subsystem 读物理内存失败 → long-poll 拉取全部报 CODE:11，消息无法消费；
      # 关闭 JVM 容器感知绕开该路径（读 /proc/meminfo 兜底），见压测变更交付说明
      JAVA_OPT_EXT: "-XX:-UseContainerSupport"
    ports:
      - "10911:10911"  # Broker 主端口
      - "10909:10909"  # 快速重连端口（vIP 通道）
    volumes:
      # brokerIP1 指向宿主机回环地址：本机 Java 服务（宿主进程）直连 127.0.0.1 可通
      - ./rocketmq/broker.conf:/home/rocketmq/conf/broker.conf:ro
    healthcheck:
      # 镜像内无 ss/nc（iproute2 未装，会永远 unhealthy），用 bash /dev/tcp 探测端口
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/10911"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - sport-verify-net

  # ---------- PostGIS：OSM 路网空间库（mapmatch-service 路网匹配，见 ADR-0006） ----------
  # 为何单独一个库不并 MySQL：路网匹配靠空间类型 geometry + GIST 索引 + ST_* 空间函数，
  # MySQL 空间能力弱（函数少、索引在 8.0 才可用且数据类型支持差），PostGIS 是空间计算事实标准
  postgis:
    image: postgis/postgis:16-3.4
    container_name: sport-verify-postgis
    environment:
      # 库名随容器首次初始化创建；导入脚本（scripts/mapmatch/import-road-network.sh）建 road_edge 路网表
      POSTGRES_DB: road_db
      POSTGRES_PASSWORD: postgres
      TZ: Asia/Shanghai
    ports:
      # 宿主机端口可用 POSTGRES_PORT 覆盖（默认 5432；宿主机已有 PostgreSQL 时设 5433，服务侧同步注入同名变量）
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgis-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d road_db"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - sport-verify-net

  # ---------- Prometheus：指标抓取 + 告警规则评估（可观测性变更，见 ADR-0003） ----------
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: sport-verify-prometheus
    # 四个 Java 服务是宿主机 java -jar 进程（不在 compose 内），抓取 target 配的
    # host.docker.internal 在 Docker Desktop 原生可用；host-gateway 映射保证
    # 迁到 Linux 宿主机同样能从容器内解析到宿主机地址
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # 本地演示 7 天数据足够，限制 TSDB 磁盘/内存占用（宿主机内存预算 3-4GB 口径）
      - --storage.tsdb.retention.time=7d
    volumes:
      # 抓取配置（四个服务 job）与告警规则（实例下线/错误率/P95/堆）一并挂入
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"   # 控制台与查询 API（Targets / Alerts / Graph）
    networks:
      - sport-verify-net

  # ---------- Grafana：可视化面板（数据源与面板 provisioning 预置，零手工配置） ----------
  grafana:
    image: grafana/grafana:10.4.2
    container_name: sport-verify-grafana
    environment:
      # 本地演示固定账号密码；生产环境改走密钥管理/SSO，勿硬编码
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      # 左：数据源 + dashboard provider 预置；右：预置面板 JSON（8 面板总览）
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"   # 控制台（admin/admin，登录后打开预置面板「全局监控总览」）
    depends_on:
      - prometheus
    networks:
      - sport-verify-net

volumes:
  mysql-data:
  # PostGIS 路网数据持久化：down 不掉路网，重跑导入脚本按覆盖刷新（幂等）
  postgis-data:
  # Prometheus TSDB 持久化：down 不掉监控历史，up 期间实例下线告警才有历史可比
  prometheus-data:

networks:
  sport-verify-net:
    driver: bridge
