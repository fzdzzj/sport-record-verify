server:
  port: 8083

spring:
  application:
    name: verify-service
  config:
    import: optional:nacos:verify-service.yml
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yml
    # Feign 熔断（规范「匹配降级」，沿用 record-service 已验证模式）：
    # 开启后 MapMatchApi(Feign) 走 Resilience4j，mapmatch 不可用时 FallbackFactory 抛 4005，
    # R5 捕获降级为不命中，校验主链路不挂。注：RecordApi 同被纳入熔断统计但无 fallback，
    # 异常穿透语义不变（record 停机时仍由全局处理器兜底，OPEN 后快速失败反而减少等待）
    openfeign:
      circuitbreaker:
        enabled: true
      # mapmatch 不可达时快速失败（R5 在校验链路内同步调用，读超时取 3s 与 record 侧口径一致）
      client:
        config:
          mapmatch-service:
            connect-timeout: 1000
            read-timeout: 3000
  # 数据源：独立 verify_db
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 宿主机已有 MySQL 占用 3306 时，compose 侧设 MYSQL_PORT=3307，服务侧注入同名变量即可，默认仍 3306
    url: jdbc:mysql://127.0.0.1:${MYSQL_PORT:3306}/verify_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    # 骨架阶段容错：中间件未启动时服务仍可启动（连接延迟到首次访问）
    hikari:
      initialization-fail-timeout: -1
  # Redisson：事件消费幂等 eventId SETNX 去重（规范「事件幂等消费」）
  data:
    redis:
      host: 127.0.0.1
      port: 6379

# RocketMQ：消费 SUBMITTED 事件触发校验，发布 VERIFIED / REJECTED 事件
rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: verify-service-group

# 校验规则阈值（默认值同审批版 §5.2，规范「规则阈值可配置」「阈值按类型分维度」；
# Nacos verify-service.yml 配置 verify.rules.* 优先级更高，改配置即生效。
# R1-R4 按运动类型分维度：RUNNING 沿用 5.5，CYCLING 速度上限放宽至 15（骑行正常 6~8 m/s 不误判），
# WALKING 降低至 3.5；缺省/未配类型回退 RUNNING）
verify:
  rules:
    v-drift: 20            # 漂移速度阈值 m/s（GPS 跳变特征，各类型共用）
    by-sport-type:
      RUNNING:
        r1:
          speed: 5.5           # 滑动窗口平均速度阈值 m/s
          window-points: 10    # 滑动窗口点数
          min-windows: 10      # 高均速持续窗口数下限（持续 ≥10 窗口）
        r2:
          accel: 3.0           # 加速度突变阈值 m/s²
          min-count: 3         # 触发次数下限
        r3:
          min-minutes: 5       # 停留段最小时长（分钟）
          max-meters: 5.0      # 停留段位移上限（米）
          segment-ratio: 0.4   # 停留段总时长占比阈值（>40% 命中）
        r4:
          max-ratio: 3.0       # 累计轨迹距离 / 起终点直线距离 比值阈值
      CYCLING:
        r1:
          speed: 15.0          # 骑行速度上限：正常骑行 6~8 m/s 不再被 R1 误判（规范「骑行不误杀」）
          window-points: 10
          min-windows: 10
        r2:
          accel: 3.0
          min-count: 3
        r3:
          min-minutes: 5
          max-meters: 5.0
          segment-ratio: 0.4
        r4:
          max-ratio: 3.0
      WALKING:
        r1:
          speed: 3.5           # 步行速度上限低于跑步
          window-points: 10
          min-windows: 10
        r2:
          accel: 3.0
          min-count: 3
        r3:
          min-minutes: 5
          max-meters: 5.0
          segment-ratio: 0.4
        r4:
          max-ratio: 3.0
    r5:
      # 离路规则（空间真实性，R5 经 Feign 调 mapmatch-service 匹配 OSM 路网，见 ADR-0006）
      off-road-ratio: 0.5  # SOFT 阈值：离路点占比 >50% 记软证据（真实沿路轨迹实测≈0，50% 给弱路网场景留余量）
      hard-off-road-ratio: 0.8 # HARD 阈值：>80% 即整段悬浮（海面/楼顶），升级硬证据直接拒绝
      min-points: 5        # 有效点数下限：短轨迹不执行 R5（无统计意义防误判）
  policy:
    soft-only-reject: true # 仅 SOFT 命中默认 REJECTED（宽松开关属后续灰度变更，本变更仅提供配置项）

# 规则读取二级缓存（Caffeine → Redis → DB 回填两级，审批版 §7.3 弹药 I，规范「二级缓存读路径」）：
# 只覆盖「规则快照/灰度路由」低频变更读路径，判定结果缓存维持单层 Caffeine（有状态机幂等兜底）。
# TTL 只做兜底上界，秒级一致靠变更监听精准失效（invalidate + Redis DEL）；Redis 异常自动降级 Caffeine+DB。
cache:
  two-level:
    enabled: true          # 总开关（关 = 退化为单层 Caffeine+DB，Redis 层整体跳过）
    ttl: 60s               # Redis 基础 TTL：兜底收敛上界，与「回滚 ≤60s」一致
    jitter: 10s            # TTL 随机抖动幅度 ±10s：防雪崩，批量写入错峰过期
    empty-ttl: 5s          # DB 未命中空值哨兵 TTL：防穿透
    lock-wait: 3s          # 互斥重建锁等待超时：防击穿，避免阻塞校验主链路
    lock-lease: 10s        # 互斥重建锁租期：持锁回源最久耗时，超时自动释放防死锁
    key-prefix: "verify:rule:cache:"   # Redis key 前缀（记录层区分业务域）

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# Resilience4j：10 次滑动窗口失败率 ≥50% → OPEN 10s → 半开试探 3 次（与 record-service 同参数，
# 一个熔断口径贯穿全系统，运维不必按服务记两套阈值）
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  # Feign 调用慢调用也计为失败（自动从超时熔断）：mapmatch 读超时 3s，限时器放宽到 4s 收尾
  timelimiter:
    configs:
      default:
        timeout-duration: 4s
        cancel-running-future: true

management:
  endpoints:
    web:
      exposure:
        # prometheus：/actuator/prometheus 以 Prometheus 文本格式暴露 Micrometer 指标（监控抓取入口）；
        # metrics：/actuator/metrics JSON 查询端点（手工排查看单个指标）
        include: health,info,prometheus,metrics
  # HTTP 指标直方图：默认只输出 count/sum/max（summary），没有 bucket；
  # P95 计算（PromQL histogram_quantile）依赖 bucket，必须显式开启，
  # 告警规则（P95>200ms）与 Grafana P95 面板均依赖此开关
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
  endpoint:
    health:
      show-details: always
