# ============================================================
# Broker 最小配置（开发环境）
# brokerIP1 必须指向宿主机可达地址：本机服务为宿主进程，直连 127.0.0.1:10911
# 生产环境应改为实际对外 IP / 域名
# ============================================================
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
brokerIP1 = 127.0.0.1
listenPort = 10911
namesrvAddr = rocketmq-namesrv:9876
# 开发环境自动创建 Topic，避免手工建 topic
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
