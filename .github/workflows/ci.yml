name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 缓存 ~/.m2 加速：key 按依赖定义（parent + 各模块 pom）哈希变化自动失效
      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: m2-

      # 验收命令的拼写只在 scripts/verify/mvn-verify.sh 里定义，本文件只引用它（入口内部固定先 clean）。
      # CI 没有仓内 settings 与离线仓，故固定 online 模式作为对外权威口径。用例为纯 Mockito 单元测试，
      # 不依赖 MySQL/Redis/Nacos 等中间件，所以不启动任何 services 容器。
      - name: Build and test
        run: bash scripts/verify/mvn-verify.sh --mode=online verify

      # 交付面判别式之一：两份编排文件组合不可解析即门槛失败（HEAD 实测该命令已 0 退出，不会一上就红）。
      - name: Compose files parse check
        run: docker compose -f docker-compose.yml -f docker-compose.services.yml config -q

      # 交付面判别式之二：复用 compose 自己的构建定义构一份代表服务镜像，覆盖容器交付路径。
      # 不手写 docker build -f——docker-compose.services.yml 里 6 个服务各自声明 context: . 与 dockerfile:，
      # 镜像定义与编排文件一旦漂移，这一步先红。其余 5 份同批模式由上一条的 config 覆盖，
      # 逐份实跑结果记在台账（8e6eb0d 修的就是"父 pom 声明全部模块、build 阶段只 COPY 部分模块"）。
      - name: Build representative service image
        run: docker compose -f docker-compose.yml -f docker-compose.services.yml build leaderboard-service

      # 公开文档口径自检：命中求职禁用词即失败（详见 README / docs 口径约定）
      - name: Public docs wording self-check
        run: |
          if git grep -n -iE "面试|弹药|大厂|八股|简历|求职|突击|附录 ?A" -- '*.md' ':!spec/changes/archive/**' ':!docs/internal/**'; then
            echo "::error::公开文档出现禁用求职口径词汇，请改用工程表述"
            exit 1
          fi

      # 各模块 JaCoCo 覆盖率报告上传为 artifact 供下载查看
      - name: Upload JaCoCo reports
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: |
            **/target/site/jacoco/jacoco.csv
            **/target/site/jacoco/jacoco.xml
            **/target/site/jacoco/index.html
          if-no-files-found: warn

  # 前端门槛：类型检查 + 生产构建，并用严格安装把依赖漂移暴露出来（前端 api 层是近期改动热点）。
  # web/package.json 既无 packageManager 也无 engines 字段 → pnpm 版本必须由本文件显式提供。
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.25.0 --activate
          pnpm --version

      # 依赖声明与已提交锁文件不一致（或锁文件缺失）时这一步直接失败，失败信号指向锁文件而非业务代码
      - name: Install with frozen lockfile
        run: pnpm --dir web install --frozen-lockfile

      - name: Type check
        run: pnpm --dir web run type-check

      - name: Build
        run: pnpm --dir web run build