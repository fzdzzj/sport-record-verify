name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 缓存 ~/.m2 加速：key 按依赖定义（parent + 各模块 pom）哈希变化自动失效
      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: m2-

      # 验收命令的拼写只在 scripts/verify/mvn-verify.sh 里定义，本文件只引用它（入口内部固定先 clean）。
      # CI 没有仓内 settings 与离线仓，故固定 online 模式作为对外权威口径。用例为纯 Mockito 单元测试，
      # 不依赖 MySQL/Redis/Nacos 等中间件，所以不启动任何 services 容器。
      - name: Build and test
        run: bash scripts/verify/mvn-verify.sh --mode=online verify

      # compose 的 6 个服务都声明 env_file: [.env]，而 .env 按约定不入库：CI 里没有它，
      # config 与 build 会在解析阶段直接报 "env file ... not found"。这里放一份占位值
      # （只为让编排可解析、镜像可构建，不用于起真服务）。本地开发仍必须自备 .env。
      - name: Provision placeholder env for compose checks
        run: cp scripts/verify/env.example .env

      # 交付面判别式之一：两份编排文件组合不可解析即门槛失败。
      # 注意：本命令必须在无 .env 的树上验证，只在有 .env 的开发机上跑过一次不算证据。
      - name: Compose files parse check
        run: docker compose -f docker-compose.yml -f docker-compose.services.yml config -q

      # 交付面判别式之二：复用 compose 自己的构建定义构一份代表服务镜像，覆盖容器交付路径。
      # 不手写 docker build -f——docker-compose.services.yml 里 6 个服务各自声明 context: . 与 dockerfile:，
      # 镜像定义与编排文件一旦漂移，这一步先红。其余 5 份同批模式由上一条的 config 覆盖，
      # 逐份实跑结果记在台账（8e6eb0d 修的就是"父 pom 声明全部模块、build 阶段只 COPY 部分模块"）。
      - name: Build representative service image
        run: docker compose -f docker-compose.yml -f docker-compose.services.yml build leaderboard-service

      # 公开口径自检：命中禁用措辞即失败。扫描范围是**全部 tracked 文本文件**（-I 跳二进制），
      # 不再按扩展名白名单取样——白名单是"新增文件类型要记得同步扩 glob"的自设盲区，
      # 曾让 4 处命中长期躲在 java/yml 注释里不被发现，而 .gitignore 这类无扩展名载体根本不匹配任何 glob。
      # 三处显式排除，理由各不同：
      #   spec/changes/archive/**  历史变更的既成措辞，本变更不动历史措辞（含本变更自己的提案存档）
      #   docs/internal/**         .gitignore 已声明为不公开，不属公开发布载体
      #   .github/workflows/ci.yml 本文件自身携带该正则与示例词，不排除则这道门槛永远红
      - name: Public docs wording self-check
        run: |
          if git grep -n -I -iE "面试|弹药|大厂|八股|简历|求职|突击|附录 ?A" -- \
              ':!spec/changes/archive/**' ':!docs/internal/**' ':!.github/workflows/ci.yml'; then
            echo "::error::公开载体出现禁用口径词汇，请改用工程表述"
            exit 1
          fi

      # 各模块 JaCoCo 覆盖率报告上传为 artifact 供下载查看
      - name: Upload JaCoCo reports
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: |
            **/target/site/jacoco/jacoco.csv
            **/target/site/jacoco/jacoco.xml
            **/target/site/jacoco/index.html
          if-no-files-found: warn

  # 前端门槛：类型检查 + 生产构建，并用严格安装把依赖漂移暴露出来（前端 api 层是近期改动热点）。
  # web/package.json 既无 packageManager 也无 engines 字段 → pnpm 版本必须由本文件显式提供。
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.25.0 --activate
          pnpm --version

      # 依赖声明与已提交锁文件不一致（或锁文件缺失）时这一步直接失败，失败信号指向锁文件而非业务代码
      - name: Install with frozen lockfile
        run: pnpm --dir web install --frozen-lockfile

      - name: Type check
        run: pnpm --dir web run type-check

      - name: Build
        run: pnpm --dir web run build

      # web/src/typed-router.d.ts 是已跟踪的生成物（提交它是为了让 IDE 与 type-check 不必先跑 codegen）。
      # 构建会重写它，故本步红 = 提交的生成物与当前路由表不同步，处置是把重新生成的结果一并提交。
      # 本地实测两次构建产物逐字节一致，该判据不抖；vue-router/auto 的类型由 src/vue-router-auto-shim.d.ts 供。
      - name: Generated router types match committed
        run: git diff --exit-code -- web/src/typed-router.d.ts