# ============================================================
# Prometheus 抓取配置（可观测性变更，见 spec/changes/add-observability 与 ADR-0003）
#
# 挂载方式：docker-compose.yml 中 prometheus 服务将本文件挂到 /etc/prometheus/prometheus.yml
# 控制台：http://127.0.0.1:9090（Status → Targets 查看抓取状态，Status → Rules 查看告警）
# ============================================================

global:
  # 抓取与规则评估周期：15s 是 Prometheus 默认值，兼顾实时性与本地资源开销；
  # 告警规则（alert-rules.yml）的 for 持续时间以此为最小评估单位
  scrape_interval: 15s
  evaluation_interval: 15s

# 告警规则文件：与本文件同目录，docker-compose 侧一并挂载到 /etc/prometheus/
rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  # ---------- 抓取地址说明（重要） ----------
  # 权威口径：六服务以容器化形态运行（docker-compose.services.yml，join sport-verify-net），
  # 因此 target 直接用 compose 网络内的服务名（DNS 直达容器端口），与端口发布无关
  # （网关 8080 全接口发布、后端 8081-8085 仅绑 127.0.0.1，均不影响容器内抓取）。
  # 宿主机进程开发态（java -jar + 仅中间件 compose）为降级容忍：此时服务名不可解析，
  # 监控可能失效；如需在开发态抓取，另配一份以 host.docker.internal 为 target 的配置
  # （Docker Desktop 原生支持；Linux 宿主机靠本服务已加的
  #   extra_hosts: host.docker.internal:host-gateway 映射）。
  # 指标路径必须是 /actuator/prometheus：Spring Boot Actuator 默认暴露在
  # /actuator 前缀下，而非 Prometheus 惯用的 /metrics。

  # ---------- 网关（宿主机 8080，WebFlux，含 Sentinel 限流指标上下文） ----------
  - job_name: gateway-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['gateway-service:8080']

  # ---------- 用户服务（宿主机 8081，user_db + Redis） ----------
  - job_name: user-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['user-service:8081']

  # ---------- 记录服务（宿主机 8082，record_db 分片 + RocketMQ + Redis） ----------
  - job_name: record-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['record-service:8082']

  # ---------- 校验服务（宿主机 8083，verify_db + RocketMQ） ----------
  - job_name: verify-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['verify-service:8083']

  # ---------- 排行榜服务（宿主机 8084，独立榜单服务，见 ADR-0005） ----------
  # add-leaderboard-service 提案已落地：榜单职责自 record-service 拆出（服务数 4→5），
  # 预留空位启用；同步动作：alert-rules.yml 中按 job 正则匹配的 ServiceInstanceDown 已加入本 job
  - job_name: leaderboard-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['leaderboard-service:8084']

  # ---------- 路网匹配服务（宿主机 8085，PostGIS 路网 + 匹配算法，见 ADR-0006） ----------
  # add-mapmatch-service 提案已落地：道路拓扑匹配独立成服务（服务数 5→6）；
  # 同步动作：alert-rules.yml 中按 job 正则匹配的 ServiceInstanceDown 已加入本 job
  - job_name: mapmatch-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['mapmatch-service:8085']
