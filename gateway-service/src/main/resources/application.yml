server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
    # Sentinel 网关限流（压测变更 spec「限流与熔断验证」+ add-sentinel-dynamic-rules）：
    # SentinelGatewayRuleConfig 启动会注册 Nacos 动态规则源（app.sentinel.nacos.data-id=gateway-flow-rules），
    # 改 Nacos 里 count 不重启即生效；Nacos 无规则时回退代码默认 5000 QPS（对齐审批版 §8.3）；
    # 超限请求经 scg.fallback 统一返回 HTTP 429 + 提示（spec 场景「返回限流提示」）
    sentinel:
      enabled: true
      eager: true
      scg:
        fallback:
          mode: response
          response-status: 429
          response-body: '{"code":429,"message":"请求过于频繁，请稍后重试（网关限流）"}'
    gateway:
      routes:
        # 认证域路由（add-jwt-auth，见 ADR-0007）：/api/auth/** 属网关白名单，
        # 直达 user-service 的 AuthController（刻意不 StripPrefix：AuthController 即映射 /api/auth/**，
        # 与 /user/** 的 StripPrefix=1 惯例不同——auth 是发 token 的入口，路径语义保持全局一致）
        - id: route-auth-service
          uri: lb://user-service
          predicates:
            - Path=/api/auth/**
        # 用户域路由
        - id: route-user-service
          uri: lb://user-service
          predicates:
            - Path=/user/**
          filters:
            - StripPrefix=1
        # 记录域路由（榜单端点已迁出：record-service 仅记录/点赞，榜单走 /leaderboard/**）
        - id: route-record-service
          uri: lb://record-service
          predicates:
            - Path=/record/**
          filters:
            - StripPrefix=1
        # 榜单域路由（服务数 4→5，见 ADR-0005）：原 /record/api/leaderboard 已下线，
        # 榜单查询统一走 /leaderboard/api/leaderboard → leaderboard-service 的 /api/leaderboard
        - id: route-leaderboard-service
          uri: lb://leaderboard-service
          predicates:
            - Path=/leaderboard/**
          filters:
            - StripPrefix=1
        # 校验域路由
        - id: route-verify-service
          uri: lb://verify-service
          predicates:
            - Path=/verify/**
          filters:
            - StripPrefix=1
        # 管理域路由（管理员终判 → verify-service，外部访问 /admin/api/appeals/{id}/review）
        - id: route-admin-service
          uri: lb://verify-service
          predicates:
            - Path=/admin/**
          filters:
            - StripPrefix=1
        # 路网匹配域路由（服务数 5→6，见 ADR-0006）：外部访问 /mapmatch/match → mapmatch-service 的 /match，
        # 主要供管理端/演示直接调匹配接口；校验链路内 verify→mapmatch 走 Feign 直连不经网关
        - id: route-mapmatch-service
          uri: lb://mapmatch-service
          predicates:
            - Path=/mapmatch/**
          filters:
            - StripPrefix=1

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://127.0.0.1:5173"
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
            exposedHeaders:
              - "*"
            maxAge: 3600

# ===== 认证鉴权（add-jwt-auth，见 ADR-0007）=====
# 网关是唯一外部入口：enabled=true 时强制校验 Bearer token，解析 userId 注入 X-User-Id、role 注入 X-Role 透传下游；
# 白名单端点（/api/auth 发 token / /actuator/health 健康探针）放行；管理端与规则版本接口走角色校验。
# 注意：已删除无路由的 /internal/** 死配置（add-resilience-hardening）——服务间 Feign 不经网关；
# 若将来误加 /internal 路由，死白名单会让安全边界瞬间塌陷。
app:
  # 密钥治理开关（add-strict-secret-fail-fast / TASK-126）：true=任一密钥项缺失
  # （JWT 密钥、内部接口 token 回落到演示默认值）即启动失败；默认 false 本地演示零扰动，
  # 下方各密钥的演示默认值原样保留
  security:
    strict: false
  auth:
    # 鉴权降级开关：false=旧行为（透传不校验，显式携带 userId），true=强制鉴权 + 数据隔离
    # 默认 false 兼容本地调试与压测脚本；切换 true 前先验证 7 个 commit 的验收项，并更新压测脚本带 token
    enabled: false
    jwt:
      # HS256 对称密钥（>=32 字节）：与 user-service 配置必须一致（本网关按同一密钥校验并注入 X-User-Id）
      # 本地默认值仅演示；生产必须经环境变量 JWT_SECRET 或配置中心统一注入
      secret: ${JWT_SECRET:sport-verify-hs256-secret-key-0123456789abcdef}
    # 白名单：/api/auth/**（注册/登录/刷新）与健康探针 /actuator/health（精确匹配，narrow-actuator-exposure）。
    # actuator 其余端点（metrics/env/prometheus 等）不经网关裸放行——监控按 ADR-0007 走内网直连，
    # 经网关访问须携带有效 token（走鉴权分支）；matchesPrefixList 对无 /** 后缀的模式走精确匹配。
    # 已删除 /internal/**（无对应路由的死配置）；/admin/** 与 /verify/rules/** 走角色校验。
    whitelist: /api/auth/**,/actuator/health
    admin:
      # 治理面角色校验开关：true=管理端/规则版本接口要求 role=ADMIN（普通用户 403/1002、未登录 401/1001）
      # 默认 true 关门；false=降级为裸放行（灰度观察，不建议生产）
      enabled: true
      # 治理面路径前缀：命中即要求 role=ADMIN；/verify/rules/** 即 verify-service RuleVersionController 外部路径
      # 榜单每日报表（某日全平台用户里程排行）属跨用户数据，仅 ADMIN 可读：
      # /leaderboard/api/leaderboard/daily 是外部路径（路由 Path=/leaderboard/** + StripPrefix=1
      # → leaderboard-service 的 /api/leaderboard/daily）；只列这一条，总榜/好友榜仍是用户面公开读接口
      paths: /admin/**,/verify/rules/**,/leaderboard/api/leaderboard/daily
    sentinel:
      # 网关流控规则 Nacos 数据源（add-sentinel-dynamic-rules）：SentinelGatewayRuleConfig 注册的
      # NacosDataSource 指向该 dataId；Nacos 里规则 JSON 数组（每个元素为 GatewayFlowRule：resource/count/intervalSec/grade），
      # 改 count 即推送更新、不重启生效。dataId 归属 DEFAULT_GROUP。配合已有 Nacos 8848。
      nacos:
        server-addr: 127.0.0.1:8848
        group-id: DEFAULT_GROUP
        data-id: gateway-flow-rules

# 健康检查端点（K8s/监控探针可用）
management:
  endpoints:
    web:
      exposure:
        # prometheus：/actuator/prometheus 以 Prometheus 文本格式暴露 Micrometer 指标（监控抓取入口）；
        # metrics：/actuator/metrics JSON 查询端点（手工排查看单个指标）
        include: health,info,prometheus,metrics
  # HTTP 指标直方图：默认只输出 count/sum/max（summary），没有 bucket；
  # P95 计算（PromQL histogram_quantile）依赖 bucket，必须显式开启，
  # 告警规则（P95>200ms）与 Grafana P95 面板均依赖此开关
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
  endpoint:
    health:
      show-details: always

# 请求贯穿：MDC traceId（add-request-tracing）
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"
